<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Instruments — Harvey Deason</title>
  <script>(function(){try{var s=localStorage.getItem('hd-mode');var d=s==='dark'||s==='light'?s:(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.dataset.mode=d;}catch(e){}})();</script>
  <link rel="stylesheet" href="/assets/css/site.css">
  <link rel="icon" href="/assets/img/seal.svg">
  <script data-goatcounter="https://harveydeason.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
</head>
<body>
  <header id="site-header"></header>
  <main>
    <section class="section" data-anim="reveal">
      <div class="container">
        <div class="section-head">
          <div>
            <h2>The instruments</h2>
            <p>Single-purpose tools. No accounts, no tracking, everything runs in your browser. Instruments open with a workshop code — ask me for it.</p>
          </div>
        </div>
        <div id="cabinet" class="bento"></div>
      </div>
    </section>
  </main>
  <footer id="site-footer"></footer>

  <script type="module">
    import { mountLayout } from '/assets/js/layout.js';
    import { loadTools, mountTools, renderSkeletonCells } from '/assets/js/tools.js';
    import { initMotion } from '/assets/js/motion.js';
    import { initPalette } from '/assets/js/palette.js';

    mountLayout('tools');

    const cabinet = document.getElementById('cabinet');
    cabinet.innerHTML = renderSkeletonCells(5);
    const toolsPromise = loadTools();
    toolsPromise.then(t => mountTools('cabinet', t))
      .catch(() => { cabinet.innerHTML =
        '<p class="sub">The cabinet is momentarily unavailable.</p>'; });

    initPalette({ tools:toolsPromise });
    initMotion();
  </script>
</body>
</html>
