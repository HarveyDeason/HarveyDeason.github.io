<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact — Harvey Deason</title>
  <script>(function(){try{var s=localStorage.getItem('hd-mode');var d=s==='dark'||s==='light'?s:(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.dataset.mode=d;}catch(e){}})();</script>
  <link rel="stylesheet" href="/assets/css/site.css">
  <link rel="icon" href="/assets/img/seal.svg">
  <script data-goatcounter="https://harveydeason.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
</head>
<body>
  <header id="site-header"></header>
  <main class="reading">
    <span class="badge"><span class="pulse"></span>Correspondence</span>
    <h1 style="font-size:clamp(34px,6vw,60px); max-width:none;">Get in touch</h1>
    <p class="sub">The quickest way to reach me is email — I read everything that comes in. Tools, essays, corrections and commissions all welcome.</p>
    <div class="cta">
      <a class="btn btn-primary" href="mailto:deason.harvey11@gmail.com">Email me</a>
      <button class="btn btn-outline" id="copy-email" data-email="deason.harvey11@gmail.com">Copy email</button>
    </div>
    <p class="sub" style="margin:36px 0 0;">
      Also on the web —
      <a class="link-btn" href="https://www.linkedin.com/in/harvey-deason-6b8914219/">LinkedIn <span class="a">→</span></a>
      &nbsp;·&nbsp;
      <a class="link-btn" href="https://harveydeason.wordpress.com/">harveydeason.wordpress.com <span class="a">→</span></a>
    </p>
  </main>
  <footer id="site-footer"></footer>
  <script type="module">
    import { mountLayout } from '/assets/js/layout.js';
    import { initMotion } from '/assets/js/motion.js';
    import { initPalette } from '/assets/js/palette.js';
    mountLayout('contact');
    initPalette();
    initMotion();
  </script>
  <script type="module">
    const b = document.getElementById('copy-email');
    b.addEventListener('click', async () => {
      try { await navigator.clipboard.writeText(b.dataset.email); } catch { return; }
      const t = b.textContent; b.textContent = 'Copied ✓';
      setTimeout(() => { b.textContent = t; }, 1500);
    });
  </script>
</body>
</html>
