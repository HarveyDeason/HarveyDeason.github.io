<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Journal — Harvey Deason</title>
  <script>(function(){try{var s=localStorage.getItem('hd-mode');var d=s==='dark'||s==='light'?s:(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.dataset.mode=d;}catch(e){}})();</script>
  <link rel="stylesheet" href="/assets/css/site.css">
  <link rel="stylesheet" href="/assets/css/shelf.css">
  <link rel="icon" href="/assets/img/seal.svg">
  <script data-goatcounter="https://harveydeason.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
</head>
<body>
  <header id="site-header"></header>
  <main>
    <section class="section" data-anim="reveal">
      <div class="container">
        <div class="section-head">
          <div>
            <h2>The Journal</h2>
            <p>Essays on doing considered work in an inconsiderate industry.</p>
          </div>
        </div>
        <p class="sr-only">The journal is shown as a bookshelf. Use the arrow keys to move between books, and Enter to open one.</p>
        <div id="journal"></div>
        <p class="shelf-credit">Bookends rendered from a 3D scan of Rodin&rsquo;s <em>The Thinker</em>
          by Scan The World, via Sketchfab.</p>
      </div>
    </section>
  </main>
  <footer id="site-footer"></footer>

  <script type="module">
    import { mountLayout } from '/assets/js/layout.js';
    import { fetchPosts, mountPosts, renderSkeletonRows } from '/assets/js/wordpress.js';
    import { observeShelf, renderSkeletonShelf } from '/assets/js/shelf.js';
    import { initMotion } from '/assets/js/motion.js';
    import { initPalette } from '/assets/js/palette.js';

    mountLayout('writing');

    // Reduced motion gets the editorial rows: a shelf is a motion device, and
    // there is no still version of it worth showing.
    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

    const journal = document.getElementById('journal');
    journal.innerHTML = reduce ? renderSkeletonRows(6) : renderSkeletonShelf(12);

    const postsPromise = fetchPosts({ all: true });
    postsPromise
      .then(p => reduce ? mountPosts('journal', p) : observeShelf('journal', p))
      .catch(() => { journal.innerHTML =
        '<p class="sub">The journal is momentarily unavailable. <a class="link-btn" href="https://harveydeason.wordpress.com/">Read on WordPress →</a></p>'; });

    initPalette({ postsPromise });
    initMotion();
  </script>
  <noscript>
    <p class="sub">The journal needs JavaScript. <a class="link-btn" href="https://harveydeason.wordpress.com/">Read on WordPress →</a></p>
  </noscript>
</body>
</html>
